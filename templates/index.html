<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        table, th, td {
          border:1px solid black;
        }
    </style>
</head>
<body>
    <table style="width:100%">
        <tr>
            <th>Username</th>
            <th>Score</th>
        </tr>
        {%for player in data%}
        <tr>
            <td>{{player[0]}}</td>
            <td>{{player[1]}}</td>
        </tr>
        {%endfor%}
    </table>
</body>
</html>
